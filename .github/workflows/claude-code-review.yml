name: Claude Code Review

# Automatic review of every human-authored PR. Runs on the repo's free
# public-repo Actions minutes; Claude usage draws on the maintainer's
# subscription via CLAUDE_CODE_OAUTH_TOKEN (not a per-token API bill).
# Re-review after pushing fixes: comment "@claude review" (see claude.yml).

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    # Bot PRs are skipped — reviewing them is noise.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@11ba60486e4aec9ddfeafcf4bb3f00b028ac2c16 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. This repo is the public, user-facing
            documentation for MorphoCloud, read by researchers, by course
            instructors setting up a class, and by their students. Most
            readers are not comfortable with CI or cloud tooling and will do
            exactly what the page says. A doc that disagrees with the code is
            a real defect here, not a nitpick.

            The behaviour being described lives in other repos, which you
            cannot see from this checkout — `MorphoCloud/MorphoCloudWorkflow`
            (source of truth for the GitHub Actions workflows, vendorized
            into `Instances` and the `MC-*` course repos) and
            `MorphoCloud/MorphoCloudAppsScripts` (intake, approval and
            enrollment, including every automated email). Use `gh` to read
            them when you need to check a claim.

            Focus on:

            1. **Claims that contradict the code (highest value)** — default
               values, variable names, timeouts, quotas, expiry windows,
               which commands exist for which instance type, who is allowed
               to run them, and which repo the reader should be acting in.
               Course, workshop and individual instances behave differently;
               text that says "all access types" is a common source of error.
            2. **Instructions that send the reader to the wrong place** — the
               wrong repository, the wrong email address, a setting that has
               moved, or a step attributed to the wrong email in a multi-email
               flow.
            3. **Missing consequences** — anything that deletes data, expires,
               or cannot be undone should say so where the reader will be
               when it matters.
            4. **Broken links and anchors**, including `#fragment` targets
               that no longer exist in the linked file.
            5. **Clarity for a non-expert reader** — prefer plain, minimal
               wording. Flag text that assumes CI knowledge. Do not add
               references to how something used to work.

            Report every issue you find, including ones you are uncertain
            about — include a confidence level and severity for each instead
            of self-filtering, and say which file you checked to confirm a
            claim. Use inline comments for specific lines and a top-level
            comment for overall observations. Do not nitpick prose style.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(gh search:*)"
